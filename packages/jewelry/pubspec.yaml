name: jewelry
description: Video goldens for Flutter integration tests. Write scenarios as plain Dart steps, record every frame on a clean emulator, compare frame by frame.
version: 0.0.1
repository: https://github.com/Bassiuz/jewelry
issue_tracker: https://github.com/Bassiuz/jewelry/issues
topics: [testing, golden, integration-test, video, emulator]
screenshots:
  - description: A recorded golden of the example app.
    path: doc/golden.gif
resolution: workspace

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Imports its frame comparator and PNG chunks from src/, so pinned to
  # the patch until it exports them.
  flutter_golden_animation: ">=0.1.1 <0.1.2"
  args: ^2.6.0
  clock: ^1.1.1
  yaml: ^3.1.2

dev_dependencies:
  flutter_lints: ^6.0.0
